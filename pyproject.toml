[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "io-gen"
dynamic = ["version"]
description = "Generate XDC constraints and HDL from a YAML pin description"
license = { text = "MIT" }
authors = [
	{ name = "George Castillo" }
]
requires-python = ">=3.11"
dependencies = [
	"pyyaml>=6.0",
	"jsonschema>=4.18,<5.0",
	"referencing>=0.30.0,<1.0",
]

[project.scripts]
io-gen = "io_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["io_gen*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"io_gen.schema" = ["*.json"]
"io_gen.schema.defs" = ["*.json"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

